apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: hackathon
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
type: Opaque
# Values are base64-encoded placeholders.
# Encode your own: echo -n 'yourvalue' | base64
# NEVER commit real passwords to version control.
data:
  # "hackathon_root_pass" base64-encoded
  mysql-root-password: aGFja2F0aG9uX3Jvb3RfcGFzcw==
  # "hackathon" base64-encoded
  mysql-database: aGFja2F0aG9u
  # "hackathon" base64-encoded
  mysql-user: aGFja2F0aG9u
  # "hackathon_pass" base64-encoded
  mysql-password: aGFja2F0aG9uX3Bhc3M=
